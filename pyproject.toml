[project]
name = "lunar-pathfinder"
version = "0.2.0a1"
description = "Lunar south-pole terrain analysis and rover route-optimization system."
readme = "README.md"
authors = [
    { name = "Jonathan Varela", email = "jvrela@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "rasterio>=1.5.1",
]

[project.scripts]
lunar-pathfinder = "lunar_pathfinder:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
